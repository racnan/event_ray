[package]
name = "event_ray_server"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
# Workspace crates
event_ray_core = { path = "../event_ray_core" }

# Third party crates
axum = "0.8.1"
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1.17"
async-stream = "0.3.6"
uuid = { version = "1.16.0", features = ["serde", "v4"] }
chrono = { version = "0.4.41", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
error-stack = "0.6.0"
thiserror = "2.0.16"
redis = { version = "1.0.1", features = ["tokio-comp"], optional = true }
envy = "0.4.2"

[features]
redis-pubsub = ["dep:redis", "event_ray_core/redis-pubsub"]
