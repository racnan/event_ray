name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack,just

      - name: Check formatting
        run: cargo fmt --check
      - name: Check compilation
        run: just check
      - name: Run lints
        run: just lint
      - name: Run tests
        run: just test
