[package]
name = "integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
event_ray_server = { path = "../event_ray_server" }
event_ray_core = { path = "../event_ray_core" }
ingestion_service = { path = "../ingestion_service" }
axum = "0.8.1"

# Test utilities
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "sync"] }
uuid = { version = "1.16.0", features = ["v4", "serde"] }
reqwest = { version = "0.12.19", features = ["json", "stream"] }
futures = "0.3.31"
eventsource-client = "0.14.0"
tokio-test = "0.4.4"
thiserror = "2.0.16"
