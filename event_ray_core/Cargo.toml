[package]
name = "event_ray_core"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.4", default-features = false, features = ["json"] }
chrono = { version = "0.4.41", features = ["serde"] }
error-stack = "0.6.0"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.16"
uuid = { version = "1.17.0", features = ["serde", "v4"] }
