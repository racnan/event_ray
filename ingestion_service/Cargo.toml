[package]
name = "ingestion_service"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
# Workspace crates
event_ray_core = { path = "../event_ray_core" }
# Third party crates
axum = "0.8.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.17.0", features = ["serde", "v4"] }
chrono = { version = "0.4.41", features = ["serde"] }
async-trait = "0.1.88"
reqwest = { version = "0.12.22", features = ["json"] }
error-stack = "0.6.0"
thiserror = "2.0.16"
redis = { version = "1.0.1", features = ["tokio-comp"], optional = true }
envy = "0.4.2"

[features]
redis-pubsub = ["dep:redis", "event_ray_core/redis-pubsub"]

